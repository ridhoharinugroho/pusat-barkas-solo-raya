<!-- MODAL PUSAT NOTIFIKASI REALTIME (BUTUH UANG & AKTIVITAS) -->
<div id="modal-notifications"
  class="fixed inset-0 z-[10000] hidden flex items-center justify-center p-3 sm:p-4 md:p-6">
  <div class="modal-backdrop fixed inset-0 bg-slate-950/75 backdrop-blur-sm" data-close-modal="modal-notifications">
  </div>

  <div
    class="modal-content relative w-full max-w-lg bg-white rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden max-h-[88vh] flex flex-col z-10 text-slate-800 animate-in fade-in zoom-in-95 duration-150">

    <!-- Header -->
    <div
      class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-200 bg-gradient-to-r from-rose-950 via-rose-900 to-amber-950 text-white flex-shrink-0">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-2xl bg-amber-400 text-rose-950 flex items-center justify-center font-black shadow-md flex-shrink-0">
          <i data-lucide="bell" class="w-5 h-5 text-rose-950"></i>
        </div>
        <div>
          <h3 class="font-black text-white text-base sm:text-lg leading-tight">Pusat Notifikasi</h3>
          <p class="text-xs text-rose-200 font-medium">Pemberitahuan Iklan BU, Rekomendasi & Info Akun</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" id="btn-mark-all-notifs-read"
          class="text-[11px] font-bold bg-white/15 hover:bg-white/25 px-2.5 py-1.5 rounded-xl text-rose-100 hover:text-white transition-all cursor-pointer backdrop-blur-sm"
          title="Tandai Semua Dibaca">
          Tandai Dibaca
        </button>
        <button data-close-modal="modal-notifications"
          class="p-2 text-rose-200 hover:text-white rounded-xl hover:bg-rose-900 transition-colors cursor-pointer"
          title="Tutup">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Scrollable Notification List Body -->
    <div id="notifications-list-container" class="p-3 sm:p-4 overflow-y-auto space-y-2.5 flex-1 bg-slate-50/70">
      <!-- Empty State Default -->
      <div id="notifications-empty-state" class="py-12 px-4 text-center space-y-3">
        <div
          class="w-16 h-16 rounded-full bg-rose-100 text-rose-800 flex items-center justify-center mx-auto shadow-inner">
          <i data-lucide="bell-off" class="w-8 h-8"></i>
        </div>
        <div class="space-y-1">
          <h4 class="font-black text-slate-800 text-sm">Belum Ada Notifikasi</h4>
          <p class="text-xs text-slate-500 max-w-xs mx-auto">Notifikasi barang Butuh Uang (BU) sesuai minat kategori
            Anda akan muncul secara instan di sini.</p>
        </div>
      </div>
    </div>

    <!-- Footer Modal -->
    <div
      class="p-3 sm:p-4 bg-slate-100 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500">
      <span class="text-[11px] font-medium flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Sinkron Realtime Supabase</span>
      </span>
      <button data-close-modal="modal-notifications"
        class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl text-xs transition-colors cursor-pointer">
        Tutup
      </button>
    </div>

  </div>
</div>
