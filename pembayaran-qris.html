<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4c0519">
  <title>Pembayaran Iklan BU - solosatset</title>
  
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=20260828">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20260828">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.33.1/dist/umd/supabase.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white p-6 sm:p-8 rounded-3xl w-full max-w-[360px] text-center shadow-2xl flex flex-col items-center relative overflow-hidden animate-in zoom-in-95 duration-300">
    <!-- Decorative glow -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-rose-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <div class="w-12 h-12 bg-rose-100 text-rose-900 rounded-2xl flex items-center justify-center mb-4 shadow-sm border border-rose-200">
      <i data-lucide="scan-line" class="w-6 h-6"></i>
    </div>

    <h3 class="mt-0 text-slate-800 font-black text-xl mb-2">Scan QRIS Iklan BU</h3>
    <p class="text-[13px] text-slate-500 mb-5 leading-relaxed">
      Selesaikan pembayaran sejumlah <strong class="text-rose-600">tepat sampai 3 digit terakhir</strong> agar terverifikasi otomatis dalam hitungan detik.
    </p>
    
    <div class="p-3 bg-slate-50 border border-slate-200 shadow-inner rounded-2xl mb-5 w-full flex justify-center">
      <img src="assets/img/qris-traktir-kopi.jpg?v=20260901_v161" alt="QRIS" class="w-52 h-52 object-contain rounded-xl mix-blend-multiply" />
    </div>
    
    <p class="text-[13px] text-slate-600 font-bold m-0 uppercase tracking-wider">Total Tagihan Unik:</p>
    <p id="qrisTotalAmount" class="text-3xl font-black text-rose-600 mt-1 mb-6 tracking-tight">Memuat...</p>
    
    <div id="statusIndicator" class="w-full p-3.5 bg-amber-50 text-amber-700 border border-amber-200 rounded-xl text-sm font-bold mb-5 flex items-center justify-center gap-2 animate-pulse shadow-sm">
      <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
      <span id="statusText">Menunggu mutasi masuk...</span>
    </div>
    
    <button type="button" id="btnCancelPayment" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold border-none py-3 px-4 rounded-xl cursor-pointer transition-colors text-sm flex items-center justify-center gap-2">
      <i data-lucide="x" class="w-4 h-4"></i>
      Batal / Kembali
    </button>
  </div>

  <script src="js/services/supabaseHelper.js?v=20260901"></script>
  <script src="js/pembayaran-qris.js?v=20260902"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
